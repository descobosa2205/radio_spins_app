<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Sin portada (álbum)">
  <!-- SIN PORTADA de un ÁLBUM: la FUNDA con el disco asomando, para distinguirlo de un single
       (que es el disco suelto de cover_placeholder.svg). -->
  <rect width="300" height="300" rx="24" fill="#eceef2"/>
  <!-- el disco, asomando por la derecha -->
  <g transform="translate(24,0)">
    <circle cx="186" cy="150" r="62" fill="none" stroke="#cdd3db" stroke-width="13"/>
    <circle cx="186" cy="150" r="17" fill="#d9dee5"/>
    <circle cx="186" cy="150" r="6" fill="#b7bfca"/>
  </g>
  <!-- la funda -->
  <rect x="58" y="88" width="124" height="124" rx="8" fill="#f7f8fa" stroke="#b7bfca" stroke-width="13"/>
  <path d="M78 108 h58" stroke="#cdd3db" stroke-width="10" stroke-linecap="round"/>
  <path d="M78 130 h38" stroke="#dde1e7" stroke-width="10" stroke-linecap="round"/>
</svg>
